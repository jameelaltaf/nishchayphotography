  <!-- Mobile only. Two stacked buttons covered too much of the page, so on a
       phone they collapse behind this one and expand on demand. -->

          aria-expanded="false" aria-controls="widget-actions"
          data-widgets-toggle aria-label="Contact options">

      <path fill="currentColor" d="M12 3C7.03 3 3 6.58 3 11c0 2.2 1.01 4.19 2.65 5.63L5 21l4.3-2.06c.85.23 1.75.35 2.7.35 4.97 0 9-3.58 9-8.29S16.97 3 12 3z"/>

  </button>

  <section class="chat" id="studio-assistant" aria-label="Studio assistant" hidden data-chat-panel>

      <div>
        <p class="chat__title">Studio assistant</p>
        <p class="chat__sub">Instant answers to common questions</p>
      </div>
      <button class="chat__close" type="button" aria-label="Close the studio assistant" data-chat-close>&times;</button>

    <div class="chat__log" role="log" aria-live="polite" aria-atomic="false" data-chat-log></div>
