<dialog class="lightbox" data-lightbox aria-label="Image viewer">
  <button class="lightbox__btn lightbox__close" type="button" data-lightbox-action="close" aria-label="Close image viewer">&times;</button>
  <button class="lightbox__btn lightbox__prev" type="button" data-lightbox-action="prev" aria-label="Previous image">&#8592;</button>
  <button class="lightbox__btn lightbox__next" type="button" data-lightbox-action="next" aria-label="Next image">&#8594;</button>
  <figure class="lightbox__figure">
    <img data-lightbox-img alt="">
    <figcaption class="lightbox__caption" data-lightbox-caption></figcaption>
  </figure>
  <p class="lightbox__count" data-lightbox-count aria-live="polite"></p>
</dialog>
